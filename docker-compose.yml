# Gateway multi-provider (LiteLLM). Expõe a API da Anthropic (/v1/messages) para o
# Claude Code e encaminha para Gemini ou OpenAI. Só é necessário para
# `make skill PROVIDER=google|openai` (sobe sozinho) ou `make gateway-up`.
#
# As variáveis abaixo são lidas do .env deste diretório (interpolação do Compose).
services:
  llm-gateway:
    image: ghcr.io/berriai/litellm:1.103.9
    container_name: refactor-skill-llm-gateway
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "${GATEWAY_PORT:-4000}:4000"
    volumes:
      - ./gateway/litellm-config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?defina LITELLM_MASTER_KEY no .env (make env gera uma)}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
